name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build (two-pass MV3)
        run: pnpm build

      - name: Install Chromium for the extension suite
        run: pnpm exec playwright install --with-deps chromium

      # Headed, under a virtual display: the tracker asks
      # `chrome.windows.getLastFocused()` on every sample, and headless Chromium
      # does not model window focus the way the extension depends on -- the suite
      # would pass by never sending a heartbeat.
      - name: Extension suite (mock bridge + real Chromium)
        run: xvfb-run -a pnpm exec playwright test
